<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Премиальное сплит-меню</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px;
            background-color: #0b0f19;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .main-container {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-trigger {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            border-radius: 30px;
            color: #f8fafc;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .menu-trigger:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: #38bdf8;
        }
        .burger-icon {
            display: flex;
            flex-direction: column;
            gap: 5px;
            width: 22px;
        }
        .burger-icon span {
            display: block;
            height: 2px;
            width: 100%;
            background-color: #f8fafc;
            transition: width 0.3s ease;
        }
        .menu-trigger:hover .burger-icon span:nth-child(2) {
            width: 60%;
        }

        .order-summary-card {
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .order-summary-card h2 {
            margin-top: 0;
            font-size: 16px;
            color: #38bdf8;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .cart-items-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .empty-cart {
            color: #64748b;
            font-style: italic;
            font-size: 14px;
        }
        .cart-total {
            margin-top: 20px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 16px;
        }

        .overlay {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 100;
            top: 0;
            left: 0;
            background-color: #0f172a;
            overflow-x: hidden;
            transition: width 0.6s cubic-bezier(0.85, 0, 0.15, 1);
            box-shadow: 10px 0 50px rgba(0, 0, 0, 0.5);
        }

        .overlay-inner {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            width: 40vw;
            padding: 40px;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .overlay.open .overlay-inner {
            opacity: 1;
            transition-delay: 0.2s;
        }

        .overlay-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #64748b;
        }

        .closebtn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .closebtn:hover {
            color: #f8fafc;
            background: rgba(255, 255, 255, 0.1);
            transform: rotate(90deg);
        }

        .overlay-content {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            max-height: calc(100vh - 280px);
            padding-right: 8px;
            
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.15) transparent;
        }

        .overlay-content::-webkit-scrollbar {
            width: 6px;
        }
        .overlay-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .overlay-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        .overlay-content::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.4);
        }

        .food-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .food-card:hover, .food-card.active {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.05);
            transform: translateX(5px);
        }
        .food-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .food-name {
            font-size: 14px;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #94a3b8;
        }
        .food-card.active .food-name {
            color: #f8fafc;
            font-weight: 600;
        }
        .food-price {
            font-size: 13px;
            font-family: monospace;
            color: #38bdf8;
            font-weight: 600;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
            padding: 4px 12px;
        }
        .qty-btn {
            background: none;
            border: none;
            color: #38bdf8;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .qty-btn:hover {
            color: #fff;
        }
        .qty-value {
            font-size: 12px;
            font-family: monospace;
            color: #cbd5e1;
        }

        .random-btn {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 2px;
            transition: all 0.2s;
        }
        .random-btn:hover {
            background: rgba(56, 189, 248, 0.2);
        }

        .overlay-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #475569;
        }

        /* Правая панель для ПК */
        .menu-image-panel {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 99;
            top: 0;
            right: 0;
            overflow: hidden;
            transition: width 0.6s cubic-bezier(0.85, 0, 0.15, 1);
            background: #060911;
        }
        .menu-image-panel.open {
            width: 60%;
        }
        .menu-image-panel img {
            width: 60vw;
            height: 100%;
            object-fit: cover;
        }

        /* ==========================================
           МОБИЛЬНАЯ АДАПТАЦИЯ
           ========================================== */
        @media screen and (max-width: 768px) {
            body {
                padding: 20px;
            }
            .overlay.open {
                width: 100% !important;
            }
            .overlay-inner {
                width: 100vw !important;
                padding: 20px;
                /* Добавляем отступ сверху под высоту картинки, чтобы она не перекрывала текст */
                padding-top: 200px !important; 
            }
            /* Картинка на телефоне становится аккуратным блоком сверху */
            .menu-image-panel.open {
                width: 100% !important;
                height: 170px !important;
                top: 0 !important;
                left: 0 !important;
                right: auto !important;
                z-index: 101 !important;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            }
            .menu-image-panel img {
                width: 100% !important;
                height: 170px !important;
            }
            .overlay-content {
                max-height: calc(100vh - 280px);
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="header-section">
            <button class="menu-trigger" onclick="openNav()">
                <div class="burger-icon">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <span>Меню</span>
            </button>
        </div>
        
        <div class="order-summary-card">
            <h2>Корзина / Ваш выбор</h2>
            <div id="cartItemsContainer" class="cart-items-list">
                <div class="empty-cart">Вы еще ничего не выбрали. Нажмите кнопку «Меню», чтобы открыть ассортимент.</div>
            </div>
            <div class="cart-total">
                <span>Итого:</span>
                <span id="cartTotalPrice" style="color: #38bdf8;">0 Kč</span>
            </div>
        </div>
    </div>
    
    <div id="myNav" class="overlay">
        <div class="overlay-inner">
            <div class="overlay-header">
                <div class="menu-title">Каталог блюд</div>
                <button class="closebtn" onclick="closeNav()">&times;</button>
            </div>
            
            <div class="overlay-content" id="menuItemsList"></div>

            <button class="random-btn" onclick="selectRandomItem()">🎲 Случайное блюдо</button>

            <div class="overlay-footer">
                <div class="copyright">© 2026 Студия</div>
                <div>Web Design</div>
            </div>
        </div>
    </div>

    <div id="myNavImage" class="menu-image-panel">
        <img id="activeDishImage" src="9898.jpg" alt="Превью меню">
    </div>

    <script>
        const dishes = [
            { id: 1, name: "Бургер Комбо", price: 189, image: "9898.jpg", qty: 0 },
            { id: 2, name: "Острый Бакет KFC", price: 249, image: "9899.jpg", qty: 0 },
            { id: 3, name: "Стрипсы и Снэк-бокс", price: 219, image: "9900.jpg", qty: 0 },
            { id: 4, name: "Лонгер Меню", price: 159, image: "9901.jpg", qty: 0 },
            { id: 5, name: "Мега Бакет Семейный", price: 349, image: "9902.jpg", qty: 0 }
        ];

        let activeIndex = 0;

        const nav = document.getElementById("myNav");
        const navImage = document.getElementById("myNavImage");
        const menuItemsList = document.getElementById("menuItemsList");
        const activeDishImage = document.getElementById("activeDishImage");
        const cartItemsContainer = document.getElementById("cartItemsContainer");
        const cartTotalPrice = document.getElementById("cartTotalPrice");

        function renderMenu() {
            menuItemsList.innerHTML = "";
            dishes.forEach((dish, index) => {
                const card = document.createElement("div");
                card.className = `food-card ${index === activeIndex ? 'active' : ''}`;
                card.onclick = () => setActiveDish(index);

                card.innerHTML = `
                    <div class="food-info">
                        <span class="food-name">0${index + 1}/ ${dish.name}</span>
                        <span class="food-price">${dish.price} Kč</span>
                    </div>
                    <div class="quantity-control" onclick="event.stopPropagation()">
                        <button class="qty-btn" onclick="changeQty(${index}, -1)">−</button>
                        <span class="qty-value">Кол-во: ${dish.qty}</span>
                        <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                    </div>
                `;
                menuItemsList.appendChild(card);
            });
            updateCartSummary();
        }

        function setActiveDish(index) {
            activeIndex = index;
            activeDishImage.src = dishes[activeIndex].image;
            renderMenu();
        }

        function changeQty(index, delta) {
            dishes[index].qty = Math.max(0, dishes[index].qty + delta);
            setActiveDish(index);
        }

        function selectRandomItem() {
            const randomIndex = Math.floor(Math.random() * dishes.length);
            setActiveDish(randomIndex);
        }

        function updateCartSummary() {
            const selectedItems = dishes.filter(d => d.qty > 0);
            
            if (selectedItems.length === 0) {
                cartItemsContainer.innerHTML = `<div class="empty-cart">Вы еще ничего не выбрали. Нажмите кнопку «Меню», чтобы открыть ассортимент.</div>`;
                cartTotalPrice.textContent = "0 Kč";
                return;
            }

            let html = "";
            let totalSum = 0;

            selectedItems.forEach(item => {
                const itemTotal = item.price * item.qty;
                totalSum += itemTotal;
                html += `
                    <div class="cart-item">
                        <span>${item.name} (${item.qty} шт.)</span>
                        <span style="color: #38bdf8; font-family: monospace;">${itemTotal} Kč</span>
                    </div>
                `;
            });

            cartItemsContainer.innerHTML = html;
            cartTotalPrice.textContent = `${totalSum} Kč`;
        }

        function openNav() {
            const isMobile = window.innerWidth <= 768;
            nav.style.width = isMobile ? "100%" : "40%";
            navImage.classList.add("open");
            nav.classList.add("open"); 
            renderMenu();
        }

        function closeNav() {
            nav.style.width = "0%";
            navImage.classList.remove("open");
            nav.classList.remove("open");
        }

        renderMenu();
    </script>
</body>
</html>
